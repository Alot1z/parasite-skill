name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || true

      - name: Generate skill graph
        run: |
          mkdir -p public
          bun bin/parasite-skill.js graph --dot > public/graph.dot
          bun bin/parasite-skill.js graph --mmd > public/graph.mmd

      - name: Generate documentation
        run: |
          bun bin/parasite-skill.js refs --per-skill
          cp -r refs/* public/ || true

      - name: Create index.html
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>parasite-skill</title>
            <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: system-ui, -apple-system, sans-serif;
                background: #0f172a;
                color: #e2e8f0;
                line-height: 1.6;
              }
              .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
              h1 { font-size: 2.2rem; margin: 2rem 0 0.5rem; }
              h2 { font-size: 1.4rem; margin: 2rem 0 1rem; color: #a5b4fc; }
              code { background: #1e293b; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
              pre { background: #1e293b; padding: 1rem; border-radius: 8px; overflow-x: auto; }
              .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin: 2rem 0; }
              .feature { background: #1e293b; padding: 1.25rem; border-radius: 8px; }
              .feature h3 { color: #a5b4fc; margin-bottom: 0.5rem; font-size: 1rem; }
              .graph { background: #1e293b; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
              .mermaid { background: #0f172a; }
              a { color: #a5b4fc; }
              footer { margin-top: 3rem; padding: 1.5rem 0; border-top: 1px solid #334155; font-size: 0.9rem; color: #94a3b8; }
            </style>
          </head>
          <body>
            <main class="container">
              <h1>parasite-skill</h1>
              <p>Routes requests to agent skills, validates against the Agent Skills spec, and injects runtime enhancements into AI clients without modifying their source.</p>

              <div class="features">
                <div class="feature">
                  <h3>Routing</h3>
                  <p>IDF-weighted scoring of ideas against every skill and skill-set.</p>
                </div>
                <div class="feature">
                  <h3>Validation</h3>
                  <p>Checks skills against the Agent Skills spec: name, description, format.</p>
                </div>
                <div class="feature">
                  <h3>Injection</h3>
                  <p>Runtime enhancements in extension folders. Source files untouched.</p>
                </div>
                <div class="feature">
                  <h3>Build hooks</h3>
                  <p>Generates Vite and webpack plugins for build-time injection.</p>
                </div>
                <div class="feature">
                  <h3>Server wrapping</h3>
                  <p>Enhancement layers around upstream servers.</p>
                </div>
                <div class="feature">
                  <h3>Traceability protection</h3>
                  <p>Three obfuscation levels for extracted code.</p>
                </div>
              </div>

              <div class="graph">
                <h2>Extension system</h2>
                <div class="mermaid">
                  graph TD
                    A[parasite-skill] --> B[Runtime Injection]
                    A --> C[Build Hooks]
                    A --> D[Server Wrapping]
                    A --> E[Traceability]
                    B --> F[Extension Folders]
                    B --> G[Manifests]
                    C --> H[Vite Plugin]
                    C --> I[Webpack Plugin]
                    D --> J[Middleware]
                    D --> K[Routes]
                    E --> L[Light]
                    E --> M[Medium]
                    E --> N[Heavy]
                </div>
              </div>

              <h2>Graph artifacts</h2>
              <p><a href="graph.dot">graph.dot</a> | <a href="graph.mmd">graph.mmd</a></p>

              <footer>
                <p>MIT license. Source: <a href="https://github.com/Alot1z/parasite-skill">github.com/Alot1z/parasite-skill</a></p>
              </footer>
            </main>
            <script>
              mermaid.initialize({ startOnLoad: true, theme: 'dark' });
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
