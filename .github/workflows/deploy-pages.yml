name: Deploy GitHub Pages (skill payload + installer)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build install bundle
        run: |
          mkdir -p _site
          # The skill payload users install (copy of the skill/ dir)
          cp -r skill _site/skill
          # A versioned tarball so installers can pin versions
          bun bin/skill-router.js bundle --out _site/skill-router-bundle.tar.gz --meta _site/install.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
