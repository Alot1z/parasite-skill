name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || true

      - name: Generate skill graph
        run: |
          mkdir -p public
          bun bin/skill-router.js graph --dot > public/graph.dot
          bun bin/skill-router.js graph --mmd > public/graph.mmd

      - name: Generate documentation
        run: |
          bun bin/skill-router.js refs --per-skill
          cp -r refs/* public/ || true

      - name: Create index.html
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Parasite Skill - Interactive Documentation</title>
            <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { 
                font-family: system-ui, -apple-system, sans-serif;
                background: #0f172a;
                color: #f8fafc;
                line-height: 1.6;
              }
              .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
              header { 
                text-align: center; 
                padding: 4rem 0;
                background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
              }
              h1 { font-size: 3rem; margin-bottom: 1rem; }
              .subtitle { font-size: 1.5rem; opacity: 0.9; }
              .features {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 2rem;
                margin: 4rem 0;
              }
              .feature {
                background: #1e293b;
                padding: 2rem;
                border-radius: 12px;
                transition: transform 0.2s;
              }
              .feature:hover { transform: translateY(-4px); }
              .feature h3 { color: #8b5cf6; margin-bottom: 1rem; }
              .graph-section {
                background: #1e293b;
                padding: 2rem;
                border-radius: 12px;
                margin: 2rem 0;
              }
              .mermaid { background: white; padding: 1rem; border-radius: 8px; }
              footer {
                text-align: center;
                padding: 2rem;
                margin-top: 4rem;
                border-top: 1px solid #334155;
              }
              a { color: #8b5cf6; }
            </style>
          </head>
          <body>
            <header>
              <div class="container">
                <h1>🦠 Parasite Skill</h1>
                <p class="subtitle">Enhance without modifying</p>
              </div>
            </header>
            <main class="container">
              <div class="features">
                <div class="feature">
                  <h3>🔌 Runtime Injection</h3>
                  <p>Add enhancements that run at startup without touching original files.</p>
                </div>
                <div class="feature">
                  <h3>🛠️ Build-time Hooks</h3>
                  <p>Generate Vite/webpack plugins for build-time injection.</p>
                </div>
                <div class="feature">
                  <h3>🖥️ Server Wrapping</h3>
                  <p>Wrap upstream servers with enhancement layers.</p>
                </div>
                <div class="feature">
                  <h3>🔒 Traceability Protection</h3>
                  <p>Obfuscate extracted code to prevent tracing.</p>
                </div>
              </div>
              <div class="graph-section">
                <h2>Skill Relationship Graph</h2>
                <div class="mermaid">
                  graph TD
                    A[Parasite Skill] --> B[Runtime Injection]
                    A --> C[Build Hooks]
                    A --> D[Server Wrapping]
                    A --> E[Traceability]
                    B --> F[Extension Folders]
                    B --> G[Manifests]
                    C --> H[Vite Plugin]
                    C --> I[Webpack Plugin]
                    D --> J[Middleware]
                    D --> K[Routes]
                    E --> L[Light]
                    E --> M[Medium]
                    E --> N[Heavy]
                </div>
              </div>
              <div class="graph-section">
                <h2>Interactive Skill Graph</h2>
                <p>View the full skill relationship graph: <a href="graph.dot">DOT Format</a> | <a href="graph.mmd">Mermaid Format</a></p>
              </div>
            </main>
            <footer>
              <p>MIT © <a href="https://github.com/Alot1z">Alot1z</a></p>
            </footer>
            <script>
              mermaid.initialize({ startOnLoad: true, theme: 'dark' });
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
