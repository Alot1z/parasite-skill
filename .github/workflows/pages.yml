name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan repository skill payload
        env:
          PARASITE_SKILL_HOME: ${{ runner.temp }}/parasite-skill-home
        run: |
          mkdir -p "$PARASITE_SKILL_HOME/.agents/skills"
          cp -R skill "$PARASITE_SKILL_HOME/.agents/skills/parasite-skill"
          node bin/parasite-skill.js scan --force --dirs "$PARASITE_SKILL_HOME/.agents/skills"
      - name: Generate the static docs site
        env:
          PARASITE_SKILL_HOME: ${{ runner.temp }}/parasite-skill-home
        run: |
          rm -rf public
          node bin/parasite-skill.js site build --out public \
            --force --dirs "$PARASITE_SKILL_HOME/.agents/skills"
      - name: Emit typed ecosystem graph artifact
        env:
          PARASITE_SKILL_HOME: ${{ runner.temp }}/parasite-skill-home
        run: |
          node bin/parasite-skill.js graph --ecosystem --json --public \
            --force --dirs "$PARASITE_SKILL_HOME/.agents/skills" > public/ecosystem-graph.json
      - name: Build zero-npm bundle
        run: node bin/parasite-skill.js bundle --out "$PWD/public/parasite-skill-bundle.tar.gz" --meta "$PWD/public/install.json"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages for this repository if it is not already
          # enabled (the site was failing to build on a fresh repo before this).
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
